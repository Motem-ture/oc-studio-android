name: build-apk

# 只做一件事：把 out/ 塞进 Capacitor 工程，出一个 APK。
# 配了签名 Secrets 就出签名包，没配就出未签名包（不失败）。
#
# 注意：`secrets` 上下文**不能**出现在 `if:` 里（工作流会直接解析失败、连 job 都不建），
# 所以判断放在 shell 里做。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      unsigned:
        description: '强制只出未签名包'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web bundle
        run: npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 镜像自带 Android SDK（cmdline-tools + 若干 platform）。
      # 不用 android-actions/setup-android：它在部分镜像上会失败，且我们只需要补装两个包。
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK="$(dirname "$(dirname "$(command -v sdkmanager)")")/.."
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -20

      - name: Assemble release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Align and sign (or keep unsigned)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FORCE_UNSIGNED: ${{ inputs.unsigned }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="OC-Studio-android.apk"

          if [ ! -f "$IN" ]; then
            echo "::error::找不到未签名 APK：$IN"
            exit 1
          fi

          "$BT/zipalign" -p -f 4 "$IN" aligned.apk

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ "${FORCE_UNSIGNED:-false}" = "true" ]; then
            echo "没有签名 Secrets（或是强制未签名）：输出未签名包"
            OUT="OC-Studio-android-unsigned.apk"
            cp aligned.apk "$OUT"
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$OUT" aligned.apk
            "$BT/apksigner" verify --print-certs "$OUT"
            echo "UNSIGNED=0" >> "$GITHUB_ENV"
          fi

          echo "APK=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT" || true

      - uses: actions/upload-artifact@v4
        with:
          name: oc-studio-android-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            仅作移植参考的构建产物，不承诺后续更新。

            - 版本：${{ github.ref_name }}
            - 文件名里带 `unsigned` 表示未签名（安装前需自行签名），否则为已签名包
            - 许可：MIT（上游 © Pokanshu, nekibud）